[package]
name = "wasm-pqc-subtle"
version = "0.2.7"
edition = "2024"
authors = ["di-framework"]
repository = "https://github.com/di-framework/wasm-pqc-subtle"
description = "Library for cross-platform post-quantum cryptography"

[workspace]
members = ["tests/smoke-consumer"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["bindgen"]
# The wasm-bindgen surface (npm package) for wasm32-unknown-unknown.
bindgen = ["dep:wasm-bindgen"]
# The `pqc-subtle:crypto@0.1.0` component (wit/world.wit) for wasm32-wasip2.
component = ["dep:wit-bindgen"]

[dependencies]
ml-dsa = "0.1.1"
ml-kem = { version = "0.3.2", features = ["getrandom"] }
argon2 = "0.6.0"
password-hash = { version = "0.6.1", optional = true, features = ["phc"] }
wasm-bindgen = { version = "0.2", optional = true }
wit-bindgen = { version = "0.61.1", optional = true, default-features = false, features = ["macros"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
